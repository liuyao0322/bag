[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bag-triton"
version = "0.1.0"
description = "Alternative-basis matrix multiplication with fused Triton primitives"
requires-python = ">=3.10"
dependencies = ["torch", "triton"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bag_triton*"]
